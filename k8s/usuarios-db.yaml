apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-db
  template:
    metadata:
      labels:
        app: usuarios-db
    spec:
      containers:
        - name: usuarios-db
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: usuarios_db
            - name: POSTGRES_USER
              value: usuarios_user
            - name: POSTGRES_PASSWORD
              value: usuarios123
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-db
spec:
  selector:
    app: usuarios-db
  ports:
    - port: 5432
      targetPort: 5432

